# docker compose -p mrp_infra up -d

version: "3.8"

services:
  mssqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mrp_sql_server
    # platform: linux/amd64
    # platform: linux/arm64/v8
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    environment:
      SA_PASSWORD: "reallyStrongPwd123"
      ACCEPT_EULA: "Y"
    networks:
      - mrp_infra_network
  
  seq:
    image: datalust/seq:latest
    container_name: mrp_seq
    ports: 
      - 5341:5341
      - 8081:80
    volumes:
      - mrpseqdata:/data
    environment:
      ACCEPT_EULA: "Y"
    networks:
      - mrp_infra_network
      
  # mongodb 1 instance
#  mongo:
#    image: mongo
#    container_name: mrp_mongo_db
#    ports:
#      - 27017:27017
#    volumes:
#      - mongodbdata:/data/db

networks:
  mrp_infra_network:
    driver: bridge
#    ipam:
#      config:
#        - subnet: 172.18.0.0/16
    
volumes:
  # mongodbdata:
  mrpseqdata:
  sqlvolume: