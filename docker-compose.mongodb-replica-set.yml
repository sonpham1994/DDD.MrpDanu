version: "3.8"

services:
  # mongodb replica set
  mongo-primary:
    container_name: mongo-primary
    image: mongo
    ports:
      - 27001:27017
    # --replSet "rs0": replica set name is `rs0`
    command: mongod --replSet "rs0" --bind_ip_all
    environment: 
      - MONGO_INITDB_REPLICASET=rs0
    restart: always
    networks:
      - mongo_replica
    volumes: 
      - ../mongodb/primary:/data/db
  
  mongo_secondary-1:
    container_name: mongo_secondary-1
    image: mongo
    ports:
      - 27002:27017
    # --replSet "rs0": replica set name is `rs0`
    command: mongod --replSet "rs0" --bind_ip_all
    environment:
      - MONGO_INITDB_REPLICASET=rs0
    restart: always
    networks:
      - mongo_replica
    volumes:
      - ../mongodb/secondary1:/data/db
  
  mongo_secondary-2:
    container_name: mongo_secondary-2
    image: mongo
    ports:
      - 27003:27017
    # --replSet "rs0": replica set name is `rs0`
    command: mongod --replSet "rs0" --bind_ip_all
    environment:
      - MONGO_INITDB_REPLICASET=rs0
    restart: always
    networks:
      - mongo_replica
    volumes:
      - ../mongodb/secondary2:/data/db
  
  mongo-arbiter:
    container_name: mongo-arbiter
    image: mongo
    ports:
      - 27004:27017
    # --replSet "rs0": replica set name is `rs0`
    command: mongod --replSet "rs0" --bind_ip_all
    environment:
      - MONGO_INITDB_REPLICASET=rs0
    restart: always
    networks:
      - mongo_replica
    volumes: []
      
volumes:
  mongo-primary:
  mongo_secondary-1:
  mongo_secondary-2:

networks:
  mongo_replica:
    driver: bridge